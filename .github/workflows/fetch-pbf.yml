# Same raw data as fetch.yml, but from the Geofabrik New Jersey extract (one download, no Overpass rate limits).
name: fetch-pbf
on:
  workflow_dispatch:
    inputs:
      bbox: { description: 'S W N E (empty = Brick Township)', required: false, default: '' }
      region: { description: 'region name: data goes to branch data-<region> (empty = brick, branch data)', required: false, default: '' }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install osmium requests numpy pillow tifffile
      - uses: actions/cache@v4
        with: { path: "nj.osm.pbf\nms-nj.zip", key: 'nj-src-${{ github.run_id }}', restore-keys: 'nj-src-' }
      - run: mkdir -p out && [ -s nj.osm.pbf ] || curl -sSL -o nj.osm.pbf https://download.geofabrik.de/north-america/us/new-jersey-latest.osm.pbf && ls -la nj.osm.pbf | tee out/stderr.txt
      - run: mkdir -p out && set -o pipefail && python tools/fetch_pbf.py nj.osm.pbf out ${{ inputs.bbox }} 2>&1 | tee -a out/stderr.txt
        shell: bash
      - run: set -o pipefail && python tools/fetch.py out --dem-only 2>&1 | tee -a out/stderr.txt
        shell: bash
        continue-on-error: true
      - run: set -o pipefail && python tools/fetch_extra.py out 2>&1 | tee -a out/stderr.txt
        shell: bash
        continue-on-error: true
      - name: commit to data branch
        if: always()
        run: |
          cd out
          git init -q -b data
          git config user.name "brick-sim fetch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "raw data (geofabrik) $(date -u +%FT%TZ)"
          B=data; if [ -n "${{ inputs.region }}" ]; then B="data-${{ inputs.region }}"; fi
          git branch -M "$B"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$B"
