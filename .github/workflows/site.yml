# Bakes the raw map data (data branch) into game tiles and publishes the game on GitHub Pages.
name: site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, tools/bake.py, tools/check.mjs, .github/workflows/site.yml]
  workflow_run:
    workflows: [fetch, fetch-pbf, ortho]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: raw }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy pillow
      - run: python tools/bake.py raw site/data
      - name: other NJ regions (branches data-<region>)
        run: |
          for r in ac mates ibsp; do
            if git ls-remote --exit-code origin "data-$r" >/dev/null; then
              git fetch -q --depth 1 origin "data-$r" && rm -rf "raw-$r" && git worktree add -q "raw-$r" FETCH_HEAD && python tools/bake.py "raw-$r" "site/regions/$r" | tail -2
            fi
          done
      - run: node tools/check.mjs site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
