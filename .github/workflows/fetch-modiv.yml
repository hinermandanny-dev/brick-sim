# Adds NJ MOD-IV tax parcels (building description, year built, lot polygon) to an existing data branch without touching its other files.
name: fetch-modiv
on:
  workflow_dispatch:
    inputs:
      region: { description: 'region (empty = Brick: branch data; else data-<region>)', required: false, default: '' }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: br
        run: |
          B=data; if [ -n "${{ inputs.region }}" ]; then B="data-${{ inputs.region }}"; fi
          echo "b=$B" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { ref: '${{ steps.br.outputs.b }}', path: raw }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python tools/fetch_modiv.py raw
      - name: commit to the data branch
        if: always()
        run: |
          cd raw
          git config user.name "brick-sim fetch"; git config user.email "actions@users.noreply.github.com"
          git add parcels.json.gz modiv-log.txt 2>/dev/null || git add modiv-log.txt
          git commit -qm "MOD-IV parcels $(date -u +%FT%TZ)" || echo "nothing new"
          git push origin HEAD:${{ steps.br.outputs.b }}
